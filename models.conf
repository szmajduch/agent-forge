# Codex models the orchestrator may choose from (forge-spawn --model <name>).
#
# Format: one model per line —  <name>   <when to use it>
# Optional line:                 default <name>    (used when --model is omitted)
#
# Use exact model names your Codex CLI accepts (`codex exec -m <name>`).
# While this file has no model lines, --model is disabled and Codex uses its own default.
#
# Verified 2026-10-28 against codex-cli 0.163.0 (ChatGPT auth): each name below
# was accepted by `codex exec -m <name>`; an invalid name fails with
# "model_not_found". Re-check after a CLI or plan change — the eligible list is
# refreshed from the server and does change.
# Descriptions follow reports/modele-openai-2026-10-28.md in the sec-edgar repo.
# The suggested effort below is a starting point, set with --effort; see README.

gpt-6-astra      hardest reasoning: architecture, conflicting evidence, deep audits (effort high-xhigh)
gpt-6.1-sol      everyday coding and analysis, larger changes, complex technical work (effort medium, harder high-xhigh)
gpt-6.1-terra    concrete code fixes, well-scoped tasks with a clear expected result (effort medium, harder high)
gpt-6-luna       simple fixes, data extraction, mechanical and tightly bounded work (effort low-medium)

# Previous generation — keep for reproducing older runs, not for new work.
gpt-6-sol        previous-generation general model for coding and analysis
gpt-5.6-sol      older general model for coding and everyday work
gpt-5.6-terra    older model for simpler, precisely described tasks
gpt-5.6-luna     older model for quick, simple tasks

default gpt-6.1-sol
