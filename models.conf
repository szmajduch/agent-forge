# Models the orchestrator may choose from (forge-spawn --model <name>).
#
# Format: one model per line —
#   <name>  <provider>  <role>  <when to use it>
#
#   provider  codex | claude | gemini   — which CLI runs the worker
#   role      worker | orchestrator | both
#
# Optional line:  default <name>   (used when --model is omitted)
#
# Only `role` worker/both models can be spawned as workers; forge-spawn refuses
# an orchestrator-only model rather than starting a worker that cannot run.
# The orchestrator itself is chosen with FORGE_ORCH_MODEL (see README).
#
# Use exact model names the provider's CLI accepts.
# While this file has no model lines, --model is disabled and each provider
# uses its own default.
#
# --- OpenAI / Codex ----------------------------------------------------------
# Verified 2026-10-28 against codex-cli 0.163.0 (ChatGPT auth): each name below
# was accepted by `codex exec -m <name>`; an invalid name fails with
# "model_not_found". Re-check after a CLI or plan change — the eligible list is
# refreshed from the server and does change.
# Descriptions follow reports/modele-openai-2026-10-28.md in the sec-edgar repo.
# The suggested effort below is a starting point, set with --effort; see README.

gpt-6-astra      codex   worker  hardest reasoning: architecture, conflicting evidence, deep audits (effort high-xhigh)
gpt-6.1-sol      codex   both    everyday coding and analysis, larger changes, complex technical work (effort medium, harder high-xhigh)
gpt-6.1-terra    codex   worker  concrete code fixes, well-scoped tasks with a clear expected result (effort medium, harder high)
gpt-6-luna       codex   worker  simple fixes, data extraction, mechanical and tightly bounded work (effort low-medium)

# Previous generation — keep for reproducing older runs, not for new work.
gpt-6-sol        codex   worker  previous-generation general model for coding and analysis
gpt-5.6-sol      codex   worker  older general model for coding and everyday work
gpt-5.6-terra    codex   worker  older model for simpler, precisely described tasks
gpt-5.6-luna     codex   worker  older model for quick, simple tasks

# --- Anthropic / Claude Code -------------------------------------------------
# Claude Code 2.1.312 accepts these aliases with `claude -p --model <name>`.
# It is the default orchestrator; as a worker it is useful when a task needs
# the same judgement the orchestrator applies (reviews, conflicting evidence).

opus         claude  both    strongest Claude: reviews, conflicting evidence, architecture
sonnet       claude  both    everyday coding and analysis, good default for Claude workers
haiku        claude  worker  cheap and quick: mechanical edits, extraction, small bounded tasks

# --- Google / Gemini ---------------------------------------------------------
# Requires an API key: a personal Google login (oauth-personal) is no longer
# served by Gemini CLI — it fails with IneligibleTierError / UNSUPPORTED_CLIENT.
# Set GEMINI_API_KEY and run `forge-doctor` to confirm. Verified 2026-10-29
# against gemini 0.66.0: with a key set, headless `gemini -p` reaches the API.

gemini-3-pro      gemini  worker  large context, long documents, broad cross-file analysis
gemini-3-flash    gemini  worker  fast and cheap: mechanical work, extraction, simple fixes

default gpt-6.1-sol
