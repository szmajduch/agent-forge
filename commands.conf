# Shell commands an antigravity (agy) worker may run — the OUTER BOUND.
#
# Why this file exists at all, and only for this one provider:
#
#   codex   gets -s workspace-write: a kernel sandbox. Anything inside the
#           worktree is allowed, nothing outside it is. No list needed.
#   claude  gets --permission-mode acceptEdits: one mode, same effect.
#   agy     has no spatial sandbox. Its only permission model is a list of
#           NAMES (see agy_permissions in bin/forge-lib.sh), so every binary a
#           worker may invoke has to be named — here.
#
# This is an upper bound, not a grant. forge-spawn --commands lets the
# orchestrator pick a SUBSET for one worker, matched to that task's acceptance
# check; it can never add a command that is not listed here. So a worker's real
# permissions are usually narrower than this file, and never wider.
#
# Format: one command per line, or several separated by whitespace. Comments
# and blank lines are ignored. Each name is a command's program name:
#
#   pytest       allows `pytest test_x.py`
#   python3      allows `python3 -m pytest`
#   pytest*      matches NOTHING — this is not a glob, do not write one
#   *            allows ANY command. See the warning below.
#
# EVERY PROGRAM IN A COMPOUND COMMAND NEEDS ITS OWN RULE. Measured against agy
# 1.4.11: agy does not run a bare `pytest test_t.py`, it builds
#
#   cd /path/to/worktree && pytest test_t.py; echo "EXIT_STATUS: $?"
#
# which needs cd, pytest AND echo. Allowing only `pytest` denies the whole
# command, and the denial names just "command" — not which part was missing.
# That is why cd and echo are in the base list below: without them almost
# every acceptance check fails, however the task is worded.
#
# A worker can always read and write files in its worktree; that is granted
# unconditionally and is not configured here.
#
# WARNING about `*`: agy has no sandbox, so `*` is not "any command in the
# worktree" — it is any command anywhere, including curl and rm -rf on paths
# outside the repo. The worktree is only the working directory, not a boundary.
# Prefer naming programs. If you do write `*`, you are choosing to rely on the
# model's judgement instead of on an enforced limit.
#
# Override for a one-off experiment with FORGE_AGY_COMMANDS, which replaces
# this file entirely (env beats config, as elsewhere in forge).

# Shell plumbing agy wraps its own commands in. Measured, not guessed: `cd`
# prefixes every command it runs, and `echo` reports the exit status.
cd echo

# Reading and navigating. agy runs `ls -la` on its own to orient itself before
# acting, so without these a worker is denied on its very first step.
#
# `cd echo ls cat` are forge's FLOOR: commands_narrow adds them to any
# --commands subset, because a subset without them fails on the worker's own
# orientation step rather than on the task. Removing one of them from THIS
# file still removes it — the floor is capped by this bound, not above it —
# but then expect agy workers to be denied before they start. They cost no
# reach: agy already has read_file/list_directory/glob/search_file_content
# unconditionally, so these are a second route to bytes it can read anyway.
ls cat find grep head tail wc

# Version control. The harness commits, but a worker needs to see state.
git

# Python acceptance checks.
python3 pytest
